<div posizione [x]="15" [y]="25" [w]="400" [h]="300" [autore]="'F'">
  <img *ngIf="showHearts() === '/hearts/vita_tripla.png'" posizione [x]="30" [y]="25" [w]="300" [h]="100" [src]="showHearts()">
  <img *ngIf="showHearts() === '/hearts/vita_doppia.png'" posizione [x]="30" [y]="25" [w]="200" [h]="100" [src]="showHearts()">

<!--Immagine score-->
  <img posizione [x]="24" [y]="100" [w]="200" [h]="60" [autore]="'F'"
       src="score/scoreBg.png">

    Score: {{ httpService.score }}</p>
</div>
