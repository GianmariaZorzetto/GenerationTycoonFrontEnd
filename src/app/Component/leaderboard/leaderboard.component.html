<a routerLink="/bedroom">
  <img posizione [x]="1890" [y]="112" [w]="60" [h]="65" src="sfondi_schermate/bottoni/x.png" alt="LB">
</a>

<div class="leaderboard-container">
  <div class="leaderboard-scroll">
    <div *ngFor="let user of allUsersLeaderboard" class="names">
      <div class="col">
        <h2>{{ user.username }}</h2>
        <h2>{{ user.difficulty }}</h2>
        <h2>{{ user.score }}</h2>
      </div>
    </div>
  </div>
</div>
