<a routerLink="/bedroom">
  <img posizione [x]="1890" [y]="112" [w]="60" [h]="65" src="sfondi_schermate/bottoni/x.png"
       alt="LB">
</a>

<div class="leaderboard-container">
  <div class="leaderboard-scroll">
    <table>
      <div style="width: fit-content; height: fit-content">
        <tr class="">
          <th>POS</th>
          <th>PUNTI</th>
          <th>UTENTE</th>
          <th>DIFFICOLTÀ</th>
        </tr>
      </div>
      <div style="width: fit-content; height: fit-content"
           *ngFor="let user of allUsersLeaderboard; let i = index" class="names">
        <tr>
          <td>{{ i + 1 }}</td>
          <td>{{ user.score }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.difficulty }}</td>
        </tr>
      </div>
    </table>
  </div>
</div>
