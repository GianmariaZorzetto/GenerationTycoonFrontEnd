<div class="image-container">
  <div *ngFor="let item of items; let i = index"
       (mouseenter)="onMouseEnter(i)"
       (mouseleave)="onMouseLeave(i)">
    <!-- Immagine di base -->
    <img posizione [x]="item.baseX" [y]="item.baseY"
         [w]="item.baseW" [h]="item.baseH" [autore]="'R'" [src]="item.baseImage"
         alt="bottone_base" class="base-image" />

    <!-- Immagine di hover -->
    <img posizione [x]="item.hoverX" [y]="item.hoverY"
         [w]="item.hoverW" [h]="item.hoverH" [autore]="'R'" [src]="item.hoverImage"
         alt="modalita_hover" class="hover-image" *ngIf="item.isHovered" />
  </div>
</div>
